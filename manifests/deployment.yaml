apiVersion: apps/v1
kind: Deployment
metadata:
  name: discoveryserver
  namespace: sj-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discoveryserver
  template:
    metadata:
      labels:
        app: discoveryserver
    spec:
      imagePullSecrets:
        - name: ncp-registry-secret
      containers:
        - name: discoveryserver
          image: sj-lab-registry.kr.ncr.ntruss.com/sj-lab-discoveryserver:latest
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_CONFIG_LOCATION
              value: "classpath:/,file:/app/config/"
            - name: JAVA_OPTS
              value: "-Dcom.sun.net.ssl.checkRevocation=false -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: discoveryserver-config # dep


