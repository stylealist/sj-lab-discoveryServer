apiVersion: v1
kind: ConfigMap
metadata:
  name: discoveryserver-config
  namespace: default
data:
  application.yml: |
    server:
      port: 8761
      servlet:
        context-path: /

    spring:
      application:
        name: discoveryservice
      profiles:
        active: local

    eureka:
      client:
        register-with-eureka: false
        fetch-registry: false
        serviceUrl:
          defaultZone: http://localhost:8761/eureka/
