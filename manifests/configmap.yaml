apiVersion: v1
kind: ConfigMap
metadata:
  name: discoveryserver-config
  namespace: sj-lab
data:
  application.yml: |
    server:
      port: 8761
      servlet:
        context-path: /
    spring:
      application:
        name: discoveryservice
    eureka:
      client:
        register-with-eureka: false
        fetch-registry: false
