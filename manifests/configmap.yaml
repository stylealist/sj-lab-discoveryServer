apiVersion: v1
kind: ConfigMap
metadata:
  name: discoveryserver-config
  namespace: sj-lab
data:
  application.yml: |
    server:
      port: 8761
      servlet:
        context-path: /
    spring:
      application:
        name: discoveryservice
      profiles:
        active: prod
    eureka:
      client:
        register-with-eureka: false
        fetch-registry: false
        service-url:
          defaultZone: http://localhost:8761/
    management:
      endpoints:
        web:
          exposure:
            include: "*"
      endpoint:
        health:
          show-details: always
  application-prod.yml: |
    eureka:
      client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
          defaultZone: http://localhost:30087/
